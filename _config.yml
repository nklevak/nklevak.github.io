# Site
title: Nastasia Klevak
bio: "computational cognitive neuroscientist and 4th-year PhD candidate at Stanford. I use behavioral experiments, neural data analyses, machine learning, and computational models to understand how cognitive effort and fatigue shape learning."
description: "Nastasia Klevak: Stanford PhD candidate in Psychology (Cognitive Neuroscience) studying cognitive fatigue, effort, and learning with fMRI and computational modeling. Interested in brain-computer interfaces."
# CV: drop your PDF at this path and the CV buttons appear automatically
cv: /assets/Klevak_CV_2026-10-26c.pdf
reading_time: true
words_per_minute: 200
logo: "assets/img/headshot_4-optimized.png"
background: "assets/img/background-optimized.jpg"
tiled_bg: false # Set this true if you want to tile your background image, otherwise it will be covered
locale: en_US
url: https://www.nastasiaklevak.com

# Jekyll
permalink: /:title/
markdown: kramdown
highlighter: $purple
kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false
mathjax: true
sass:
  sass_dir: _sass
  style: compressed

